<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Circle background -->
  <circle cx="32" cy="32" r="32" fill="#3E2723"/>
  <!-- Inner gradient glow -->
  <circle cx="32" cy="32" r="32" fill="url(#grad)"/>
  <defs>
    <radialGradient id="grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#6D4C41" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3E2723" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- V letter -->
  <text x="32" y="46" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#FDFBF7" text-anchor="middle">V</text>
</svg>
